image: mcr.microsoft.com/dotnet/sdk:7.0

stages:
  - build
  - test
  - integration

before_script:
  - apt-get update -qy
  - apt-get install -y curl
  - cd src/monitor-service
  - dotnet restore
  - cd ../../tests/MonitorService.Tests
  - dotnet restore

build:
  stage: build
  script:
    - cd ../../src/monitor-service
    - dotnet build --configuration Release

test:
  stage: test
  script:
    - cd ../../tests/MonitorService.Tests
    - dotnet test --configuration Release

integration:
  stage: integration
  script:
    - |
      BASE_URL="http://144.21.57.120:8082/api"

      which curl || { echo "curl not installed!"; exit 1; }

      echo "Adding new endpoint..."
      response=$(curl -s -X POST "$BASE_URL/config/endpoints" \
        -H "Content-Type: application/json" \
        -d '{"FriendlyName": "TestEndpoint", "Url": "http://example.com"}')

      if [[ "$response" == *"id"* ]]; then
        endpoint_id=$(echo $response | jq -r '.id')
        echo "Added endpoint with ID: $endpoint_id"
      else
        echo "Failed to add endpoint. Response: $response"
        exit 1
      fi

      echo "Fetching all endpoints..."
      curl -s "$BASE_URL/config/endpoints"

      echo "Testing the newly added endpoint..."
      test_response=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/endpoint-tester/test-endpoint" \
        -X POST \
        -H "Content-Type: application/json" \
        -d "{\"Endpoint\": \"http://example.com\"}")
      if [ "$test_response" -eq 200 ]; then
        echo "Endpoint test successful!"
      else
        echo "Endpoint test failed with status code $test_response"
        exit 1
      fi

      echo "Deleting the added endpoint..."
      delete_response=$(curl -s -X DELETE "$BASE_URL/config/endpoints/$endpoint_id")

      if [[ "$delete_response" == "null" ]]; then
        echo "Successfully deleted endpoint with ID: $endpoint_id"
      else
        echo "Failed to delete endpoint. Response: $delete_response"
        exit 1
      fi
